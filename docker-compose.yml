services:
  db:
    image: postgres:15-alpine
    container_name: hardware_tracker_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: hardware_tracker_web
    command: ["python", "app.py"]
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=${DATABASE_URI}
      - TZ=America/Argentina/Buenos_Aires
    depends_on:
      - db
    restart: always
    volumes:
      - .:/app

  worker:
    build: .
    container_name: hardware_tracker_worker
    command: ["python", "config/worker.py"]
    environment:
      - DATABASE_URL=${DATABASE_URI}
      - TZ=America/Argentina/Buenos_Aires
    depends_on:
      - db
    restart: always
    volumes:
      - .:/app

volumes:
  postgres_data: